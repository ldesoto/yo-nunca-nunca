# Optional: run only the game server image.
# Questions live in a local SQLite file (NOT CardNexus / LEADS Postgres).
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: '2567'
      NODE_ENV: production
      YNN_SQLITE_PATH: /data/ynn.sqlite
    ports:
      - '2567:2567'
    volumes:
      - ynn_sqlite:/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||2567)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  ynn_sqlite:
