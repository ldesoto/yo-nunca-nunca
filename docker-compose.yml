# Optional: run only the game server image.
# Questions live in a local SQLite file (NOT CardNexus / LEADS Postgres).
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: '2567'
      NODE_ENV: production
      YNN_SQLITE_PATH: /data/ynn.sqlite
    ports:
      - '2567:2567'
    volumes:
      - ynn_sqlite:/data

volumes:
  ynn_sqlite:
